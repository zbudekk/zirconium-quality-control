name: metryki

on:
  workflow_dispatch:
    inputs:
      tryb:
        description: "Tryb metryk"
        type: choice
        options: [szybko, pelne]
        default: pelne
  schedule:
    - cron: "17 3 * * 0"  # niedziela 03:17 UTC, tryb pelne

permissions:
  contents: read

concurrency:
  group: metryki-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metryki:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Biblioteki systemowe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libgomp1 libegl1
      - name: Zaleznosci
        run: python -m pip install -r requirements-ci.txt
      - name: Wersje stosu
        run: python -c "import open3d, trimesh, numpy; print(open3d.__version__, trimesh.__version__, numpy.__version__)"
      - name: Metryki odbiorcze (kod 3 = ponizej progu = czerwony job)
        env:
          TRYB: ${{ inputs.tryb || 'pelne' }}
        run: python -m qc.metryki --"$TRYB" --wyjscie metryki.json
      - name: Artefakt metryki.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metryki-${{ github.run_number }}
          path: metryki.json
          retention-days: 30
          if-no-files-found: warn

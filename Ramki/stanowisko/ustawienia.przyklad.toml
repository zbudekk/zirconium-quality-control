# WZÓR pliku ustawień. Skopiuj jako ustawienia.toml (ten plik nie trafia do git) i uzupełnij ścieżki tej maszyny.
# Jedyny plik ustawień programu stanowiska (ścieżki, progi, parametry skanera); kod: stanowisko/ustawienia.py.
# Wartości progów z planu wdrożenia v2; stroi się je na próbie testowej, nie w kodzie.

[sciezki]
folder_eksportu_skanera = "C:/Aidite/Scandata"       # obserwowany przez moduł scanner (do potwierdzenia: Order Save Path)
folder_cyrkon = "C:/sciezka/do/OneDrive/Cyrkon"     # projekty STL (SharePoint zsynchronizowany lokalnie)
folder_prywatne = "C:/sciezka/do/OneDrive/Prywatne"
folder_millbox = "C:/MillBox/raporty"
baza = "dane/stanowisko.sqlite"
log_excel = "dane/log_excel.csv"

[plytki]   # katalogi z uklad.json i plytka_n*.stl, względem katalogu programu (nie cwd)
wieczorna = "modele_plytek/wieczorna"
poranna = "modele_plytek/poranna"
okragla_wieczorna = "modele_plytek/okragla_wieczorna"   # płytki okrągłe ø100 (R57, 2.11.2026)
okragla_poranna = "modele_plytek/okragla_poranna"
# Powyżej układ gniazd R59 (14.11.2026: wieczorna 18 + 1 rynienka, poranna 23 + 1). Poniżej poprzedni układ R54
# (18 + 2 i 31 + 2) — dla płytek fizycznych zamówionych przed R59; numery płytek są te same (n1–n6, n8, n9),
# więc układ rozpoznaje program ze skanu po rozstawie stożków (porownaj: --plytka auto, okno: „rozpoznaj automatycznie”);
# przy układzie wybranym ręcznie program ostrzega, gdy skan do niego nie pasuje (plate: strażnik układu).
# Wiersze okragla_* i *_r54 są opcjonalne: brakujące układy dostarczane z programem są dopisywane przy wczytaniu ustawień.
wieczorna_r54 = "modele_plytek/wieczorna_r54"
poranna_r54 = "modele_plytek/poranna_r54"
okragla_wieczorna_r54 = "modele_plytek/okragla_wieczorna_r54"
okragla_poranna_r54 = "modele_plytek/okragla_poranna_r54"

[match]
prog_akceptacji_pokrycie = 0.85     # udział powierzchni skanu w odległości ≤ odleglosc_max od projektu
odleglosc_max_mm = 0.05
prog_ostrzezenia_pokrycie = 0.6     # pokrycie poniżej akceptacji, ale powyżej tego = żółte (sprawdź), niżej = szare
pewnosc_min = 0.1                   # pokrycie 1. kandydata musi przewyższać 2. co najmniej o tyle
filtr_wymiar_mm = 1.5               # filtr wstępny: wymiary obrysu/wysokość fragmentu vs projekt × współczynnik, tolerancja mm…
filtr_wymiar_udzial = 0.15          # …albo udział (większe z dwojga)
filtr_objetosc_udzial = 0.35        # tolerancja objętości otoczki wypukłej
pula_wieczor_dni = 2
pula_rano_dni_roboczych = 4
usun_z_puli_po_dniach = 10

[inspect]
prog_glebokosci_mm = 0.08           # skan co najmniej tyle pod powierzchnią projektu
srednica_min_mm = 0.2
srednica_max_mm = 1.5
pas_brzegu_mm = 1.5
poprawka_min_mm = 2.0               # gładka różnica większa niż to = poprawka ręczna, nie ubytek
krawedz_pas_mm = 0.15               # metoda A: pierścień wokół plamy, w którym odchyłka ma wrócić do ~0 (ostra krawędź; ubytek ma ścianę < 0,05 mm, poprawka łagodne zbocze)
min_punktow_plamy = 6               # metoda A: mniej punktów pod powierzchnią to szum, nie plama
drgniecie_odchylka_mm = 0.07        # drgnięcie: |odchyłka| powyżej tego = punkt „rozmyty”
drgniecie_udzial_w_komorce = 0.10   # drgnięcie: komórka 1 mm jest rozmyta, gdy tyle jej punktów jest rozmytych
drgniecie_udzial_obszaru = 0.10     # drgnięcie: tyle rozmytych komórek = podwójna powierzchnia → skan ponownie
wciecie_min_mm = 0.2                # metoda B: wcięcie linii brzegu = ukruszenie
wciecie_pewne_mm = 0.4              # metoda B: samo wcięcie tej wielkości = czerwone (bez potwierdzenia metodą A)
linia_min_udzial = 0.9              # metoda B tylko gdy linia brzegu widoczna prawie cała; mniej (bokiem, zasłonięta) → B pominięta (P3a: przy 0,6 bokiem dawało 18 fałszywych wcięć); zmierzyć na prawdziwym skanie w P3b
pas_brzegu_od = "linia_i_plaszczyzna"  # pas brzegu = suma pasa od linii krawędzi brzegu każdego filaru (P2) i pasa sprzed P2 (od najwyższego punktu pracy); „nie sprawdzono” tylko przy braku danych skanu. "linia" = sam pas od linii (niepewna linia projektu też daje „nie sprawdzono”), "plaszczyzna" = sposób sprzed P2 — do porównań
brzeg_min_sprawdzony = 0.9          # filar jest sprawdzony, gdy co najmniej taka część jego linii brzegu ma pewną linię projektu i dane skanu; mniej → „nie sprawdzono” (żółte, nigdy zielone)
brzeg_max_przerwa_mm = 1.5          # … i gdy najdłuższy odcinek linii bez sprawdzenia nie przekracza tej długości (odcinek krótszy niż pas brzegu jest objęty kontrolą z sąsiednich odcinków)

[synth]    # generator sztucznych skanów; zakres średnic i pas brzegu ubytków bierze z [inspect]
szum_sigma_mm = 0.03
wspolczynnik_min = 1.20
wspolczynnik_max = 1.25
odstep_ubytku_mm = 0.05             # odstęp punktów nowej powierzchni ubytku i jej otoczenia (gęstość skanu przyjęta w testach krawędzi; zmierzyć na skanerze w P3b)
krawedz_rozmiar_min_mm = 0.08       # K6 (--krawedz): ukruszenia celowe na krawędzi brzegu, rozmiar = promień kuli o środku na powierzchni
krawedz_rozmiar_max_mm = 0.40

[excel]
kolumna_kuwety = "C"
kolumna_nazwy = "H"
kolumna_odhaczenia = "B"
kolor_rgb = [198, 239, 206]
tryb_pytaj_przed_zapisem = true

[ramki]
port = 8765
wieczorna_host = "ramka-w.local"
poranna_host = "ramka-p.local"

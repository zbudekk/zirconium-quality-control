# WZÓR pliku ustawień. Skopiuj jako ustawienia.toml (ten plik nie trafia do git) i uzupełnij ścieżki tej maszyny.
# Jedyny plik ustawień programu stanowiska (ścieżki, progi, parametry skanera); kod: stanowisko/ustawienia.py.
# Wartości progów z planu wdrożenia v2; stroi się je na próbie testowej, nie w kodzie.

[sciezki]
folder_eksportu_skanera = "C:/Aidite/Scandata"       # obserwowany przez moduł scanner (do potwierdzenia: Order Save Path)
folder_cyrkon = "C:/sciezka/do/OneDrive/Cyrkon"     # projekty STL (SharePoint zsynchronizowany lokalnie)
folder_prywatne = "C:/sciezka/do/OneDrive/Prywatne"
folder_millbox = "C:/MillBox/raporty"
baza = "dane/stanowisko.sqlite"                     # plik bazy (SQLite): skany, prace, decyzje; ścieżka względna = od katalogu programu; poza OneDrive
log_excel = "dane/log_excel.csv"
wyniki = "dane/wyniki"                              # opcjonalny (etap 3): pliki wyników skanów <skan>_wynik.json zapisywane przez moduł session
podglady = "dane/podglady"                          # opcjonalny (etap 3): pliki *_podglad.npz z analizy (punkty i odchyłki gniazd — obraz odchyłek w oknie)
pula_cache = "dane/pula_cache"                      # opcjonalny (etap 3): pamięć linii brzegu projektów na dysku (przyspiesza pierwszą płytkę po starcie)
logi = "dane/logi"                                  # opcjonalny (etap 3): log programu „Stanowisko” i procesu analizy
kalibracja_ramek = "dane/kalibracja_ramek.json"    # opcjonalny (E3-A8i): lokalny plik kalibracji diod ramek (blok pikseli pod kazdym gniazdem, plik od paczki C2); brak pliku = wartosci startowe z geometrii plytek

[plytki]   # katalogi z uklad.json i plytka_n*.stl, względem katalogu programu (nie cwd)
wieczorna = "modele_plytek/wieczorna"
poranna = "modele_plytek/poranna"
okragla_wieczorna = "modele_plytek/okragla_wieczorna"   # płytki okrągłe ø100 (R57, 2.11.2026)
okragla_poranna = "modele_plytek/okragla_poranna"
# Powyżej układ gniazd R59 (14.11.2026: wieczorna 18 + 1 rynienka, poranna 23 + 1). Poniżej poprzedni układ R54
# (18 + 2 i 31 + 2) — dla płytek fizycznych zamówionych przed R59; numery płytek są te same (n1–n6, n8, n9),
# więc układ rozpoznaje program ze skanu po rozstawie stożków (porownaj: --plytka auto, okno: „rozpoznaj automatycznie”);
# przy układzie wybranym ręcznie program ostrzega, gdy skan do niego nie pasuje (plate: strażnik układu).
# Wiersze okragla_* i *_r54 są opcjonalne: brakujące układy dostarczane z programem są dopisywane przy wczytaniu ustawień.
wieczorna_r54 = "modele_plytek/wieczorna_r54"
poranna_r54 = "modele_plytek/poranna_r54"
okragla_wieczorna_r54 = "modele_plytek/okragla_wieczorna_r54"
okragla_poranna_r54 = "modele_plytek/okragla_poranna_r54"
# E3-O1 (21.11.2026): plytki okragle n1-n6 do ramek (R58) - gniazda, stozki i numery jak kwadrat R59 (n1-n3 wieczorna,
# n4-n6 poranna), obrys i dolki kodu jak plytka okragla testowa. Wiersze opcjonalne (dopisywane jak okragla_* i *_r54);
# maja zostac NA KONCU listy - kolejnosc [plytki] to kolejnosc kandydatow automatycznego rozpoznania ukladu.
okragla_ramkowa_wieczorna = "modele_plytek/okragla_ramkowa_wieczorna"
okragla_ramkowa_poranna = "modele_plytek/okragla_ramkowa_poranna"

[match]
prog_akceptacji_pokrycie = 0.85     # udział powierzchni skanu w odległości ≤ odleglosc_max od projektu
odleglosc_max_mm = 0.05
prog_ostrzezenia_pokrycie = 0.6     # pokrycie poniżej akceptacji, ale powyżej tego = żółte (sprawdź), niżej = szare
pewnosc_min = 0.1                   # pokrycie 1. kandydata musi przewyższać 2. co najmniej o tyle
filtr_wymiar_mm = 1.5               # filtr wstępny: wymiary obrysu/wysokość fragmentu vs projekt × współczynnik, tolerancja mm…
filtr_wymiar_udzial = 0.15          # …albo udział (większe z dwojga)
filtr_objetosc_udzial = 0.35        # tolerancja objętości otoczki wypukłej
filtr_wysokosc_min_udzial = 0.5     # fragment może być niższy niż projekt (dół w gnieździe, widok z góry), ale nie niższy niż tyle jego wysokości; obrys i objętość liczone wobec projektu przyciętego do wysokości fragmentu (1.0 = stara reguła ± tolerancja)
korekta_skali = true                # korekta skali ze skanu dla rozpoznanej pracy (decyzja 06.11.2026); na płytkach porannych tylko pomiar, bez stosowania
korekta_skali_okno_proc = 1.0       # poprawka skali stosowana tylko w oknie ± tyle procent wokół współczynnika z puli; poza oknem: bez korekty + ostrzeżenie
korekta_skali_ostrzezenie_proc = 0.3  # |poprawka| powyżej tego = ostrzeżenie „sprawdź współczynnik / krążek”
korekta_skali_pas_brzegu_mm = 2.0   # punkty skanu bliżej brzegu niż tyle (od z = 0 projektu w dół) nie biorą udziału w wyznaczaniu skali — ukruszenie / odchyłka krawędzi nie zmienia skali
pula_wieczor_dni = 2
pula_rano_dni_roboczych = 4
usun_z_puli_po_dniach = 10

[inspect]
prog_glebokosci_mm = 0.08           # skan co najmniej tyle pod powierzchnią projektu
srednica_min_mm = 0.2
srednica_max_mm = 1.5
pas_brzegu_mm = 1.5
poprawka_min_mm = 2.0               # gładka różnica większa niż to = poprawka ręczna, nie ubytek
krawedz_pas_mm = 0.15               # metoda A: pierścień wokół plamy, w którym odchyłka ma wrócić do ~0 (ostra krawędź; ubytek ma ścianę < 0,05 mm, poprawka łagodne zbocze)
min_punktow_plamy = 6               # metoda A: mniej punktów pod powierzchnią to szum, nie plama
drgniecie_odchylka_mm = 0.07        # drgnięcie: |odchyłka| powyżej tego = punkt „rozmyty”
drgniecie_udzial_w_komorce = 0.10   # drgnięcie: komórka 1 mm jest rozmyta, gdy tyle jej punktów jest rozmytych
drgniecie_udzial_obszaru = 0.10     # drgnięcie: tyle rozmytych komórek = podwójna powierzchnia → skan ponownie
wciecie_min_mm = 0.2                # metoda B: wcięcie linii brzegu = ukruszenie
wciecie_pewne_mm = 0.4              # metoda B: samo wcięcie tej wielkości = czerwone (bez potwierdzenia metodą A)
linia_min_udzial = 0.9              # metoda B tylko gdy linia brzegu widoczna prawie cała; mniej (bokiem, zasłonięta) → B pominięta (P3a: przy 0,6 bokiem dawało 18 fałszywych wcięć); zmierzyć na prawdziwym skanie w P3b
pas_brzegu_od = "linia_i_plaszczyzna"  # pas brzegu = suma pasa od linii krawędzi brzegu każdego filaru (P2) i pasa sprzed P2 (od najwyższego punktu pracy); „nie sprawdzono” tylko przy braku danych skanu. "linia" = sam pas od linii (niepewna linia projektu też daje „nie sprawdzono”), "plaszczyzna" = sposób sprzed P2 — do porównań
brzeg_min_sprawdzony = 0.9          # filar jest sprawdzony, gdy co najmniej taka część jego linii brzegu ma pewną linię projektu i dane skanu; mniej → „nie sprawdzono” (żółte, nigdy zielone)
brzeg_max_przerwa_mm = 1.5          # … i gdy najdłuższy odcinek linii bez sprawdzenia nie przekracza tej długości (odcinek krótszy niż pas brzegu jest objęty kontrolą z sąsiednich odcinków)

[synth]    # generator sztucznych skanów; zakres średnic i pas brzegu ubytków bierze z [inspect]
szum_sigma_mm = 0.03
wspolczynnik_min = 1.20
wspolczynnik_max = 1.25
odstep_ubytku_mm = 0.05             # odstęp punktów nowej powierzchni ubytku i jej otoczenia (gęstość skanu przyjęta w testach krawędzi; zmierzyć na skanerze w P3b)
krawedz_rozmiar_min_mm = 0.08       # K6 (--krawedz): ukruszenia celowe na krawędzi brzegu, rozmiar = promień kuli o środku na powierzchni
krawedz_rozmiar_max_mm = 0.40

[excel]
kolumna_kuwety = "C"
kolumna_nazwy = "H"
kolumna_odhaczenia = "B"
kolor_rgb = [198, 239, 206]
tryb_pytaj_przed_zapisem = true     # etap 3 (DW10): zawsze pytaj albo cien - false NIE wlacza zapisu samodzielnego
# E3-A9: klucze opcjonalne (plik bez nich dziala - wartosci jak ponizej); uklad arkusza DO POTWIERDZENIA na kopii pliku (D2)
kolumna_daty = "A"                  # data zlecenia (regula 3: najnowsza data sposrod wierszy kuwety)
pierwszy_wiersz = 2                 # pierwszy wiersz danych (wiersz 1 = naglowek)
skoroszyt = ""                      # nazwa (albo jej fragment) otwartego pliku zlecen; "" = aktywny skoroszyt
arkusz = ""                         # nazwa arkusza; "" = aktywny arkusz (plan wdrozenia: "biezacy arkusz")
tryb = "pytaj"                      # "pytaj" = kolor pola B dopiero po zatwierdzeniu przez czlowieka; "cien" = nic nie zapisuje, tylko log porownawczy
odswiez_co_min = 5.0                # co ile minut program czyta kolumny A-I arkusza do pamieci (propozycja i zatwierdzenie czytaja zawsze od nowa)
maks_wiek_dni = 60                  # wiersz wybrany regulami starszy niz tyle dni (albo bez daty w A) = "Excel: wskaz wiersz"; 0 = bez limitu; liczba do potwierdzenia na kopii pliku (D2)

[ramki]
port = 8765
wieczorna_host = "ramka-w.local"
poranna_host = "ramka-p.local"
klucz = ""                          # opcjonalny (E3-A8i): wspolny klucz laptopa i ramek (naglowek X-Ramka-Klucz) - WPISZ tylko w lokalnym pliku ustawien, ten sam co klucz w pliku konfiguracji ramki (16-256 znakow bez odstepu); pusty = bez klucza: wolno tylko w sieci, w ktorej sa wylacznie laptop i ramki
odpytywanie_s = 25.0                # opcjonalny (E3-A8i): najdluzsze czekanie na zdarzenia ramki w jednym zapytaniu, sekundy 0.5-25 (ramka i tak skraca)

[sesja]    # opcjonalna (etap 3): plik ustawień sprzed etapu 3 nie ma tej sekcji i działa — brakujące klucze dostają wartości jak poniżej
operatorzy = []                     # WPISZ osoby do wyboru na początku zmiany, np. ["Technik A", "Technik B"]; wybrana osoba trafia do kolumny „operator” przy każdej decyzji; przy pustej liście program działa i przyjmuje skany, ale decyzji „Ukruszona” / „OK” nie zapisuje
przechowuj_skany_dni = 0            # po ilu dniach wolno usuwać pliki skanów; 0 = nie usuwać (tryb cienia: trzymamy wszystko), po trybie cienia 30; wyniki i baza zostają bezterminowo
granica_doby_godz = 6               # początek doby roboczej: skany przyjęte od 6:00 do 6:00 następnego dnia (zmiany 1, 2 i 3) należą do jednej doby, nazwanej datą początku
zmiany_start_godz = [6, 14, 22]     # początki zmian 1, 2, 3 (numer zmiany przy skanie i na liście „do dofrezowania”); godziny rosnące, pierwsza = granica_doby_godz
ponowny_skan_okno_min = 60          # ta sama płytka przyjęta do tylu minut po poprzednim skanie = pytanie „to ponowny skan?”; później = nowy wsad; musi być > 0
ponowny_skan_min_wspolnych = 0.5    # E3-A1p: pytanie "to ponowny skan?" tylko, gdy wspolne projekty prac rozpoznanych (top-1, bez szarych) nowego i poprzedniego skanu tej plytki stanowia co najmniej taka czesc mniejszego z obu zbiorow projektow - te same prace = ten sam wsad; plytka z nowym wsadem nie dostaje pytania; ten sam plik skanu albo mniej niz 3 projekty rozpoznane w ktoryms skanie = pytanie jak dawniej; 0 = bez tego warunku (regula sprzed 18.11.2026); udzial z [0, 1]

[scanner]  # opcjonalna (etap 3): obserwacja folderu eksportu skanera ([sciezki] folder_eksportu_skanera); wartości jak poniżej = domyślne modułu scanner
stabilizacja_ms = 300               # tyle bez zmiany rozmiaru i czasu pliku, zanim plik jest oceniany jako zapisany do końca
min_rozmiar_mb = 0.0                # mniejszy plik nie jest skanem (0 = bez progu; próg dla prawdziwego skanera po pierwszych skanach)
min_trojkatow = 1                   # plik z mniejszą liczbą trójkątów nie jest skanem
wzorzec_pliku = "*.stl"             # wzorzec NAZWY pliku skanu (bez rozróżniania wielkości liter)
rekurencyjnie = true                # czy patrzeć też w podfoldery folderu eksportu
obserwator = "watchdog"             # "watchdog" albo "odpytywanie" (sam przegląd folderu co 2 s, np. dla dysku sieciowego)

[silnik]   # opcjonalna (etap 3): analiza skanu w osobnym procesie; wartości jak poniżej = domyślne modułu silnik
limit_zadania_s = 600.0             # analiza jednej płytki dłuższa niż tyle sekund jest przerywana (błąd „analiza trwała za długo”)
czekaj_na_plik_s = 60.0             # jak długo ponawiać kopiowanie pliku skanu, który trzyma inny program
pamiec_linii = true                 # czy trzymać linie brzegu projektów na dysku ([sciezki] pula_cache); true = szybsza pierwsza plytka po starcie (E3-A5i: domyslnie true)
ponow_plik_niedostepny = 3          # ile razy program sam ponawia analizę skanu, którego pliku nie dało się odczytać, zanim zgłosi błąd
pula_wpisow = false                 # E3-A5i: true = pula per praca z katalogu zlecen (indeks folder_cyrkon / folder_prywatne + wspolczynniki.csv w folder_millbox: kazda praca ze wspolczynnikiem swojego krazka, wynik wskazuje frezowanie); false = pula z jednego folderu i wspolczynnik reczny (jak dotad)
pamiec_puli_dni = 30                # E3-A5i: przy starcie programu usun z pamieci puli ([sciezki] pula_cache/projekty, ok. 5 MB na wpis) wpisy nieuzywane od tylu dni; 0 = nie usuwac

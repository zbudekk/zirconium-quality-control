<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <pattern id="wood" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#e9dcc3"/>
      <path d="M0 10 H40 M0 25 H40" stroke="#dccbaa" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow"><stop offset="0" stop-color="#4cff5a"/><stop offset="1" stop-color="#1e8f2a"/></radialGradient>
  </defs>
  <rect width="960" height="780" fill="url(#wood)"/>
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#222">Ramka poranna wg planu v1 — widok z góry (stół rozkładania) i z przodu</text>
  <text x="20" y="46" fill="#444">Skala 2 px = 1 mm. Klawiatura leży luzem w osobnej podstawce; w ramce jest tylko odbiornik USB.</text>

  <!-- ===== WIDOK Z GÓRY ===== -->
  <!-- blat 200x200 grafit -->
  <rect x="100" y="120" width="400" height="400" rx="10" fill="#3a3d42" stroke="#1d1f22" stroke-width="2"/>
  <!-- okno 162 + dyfuzor -->
  <rect x="138" y="158" width="324" height="324" rx="2" fill="#dfe3e6" stroke="#26282b" stroke-width="1"/>
  <!-- piksele marginesu: delikatna siatka -->
  <g stroke="#cfd4d8" stroke-width="0.5" opacity="0.5">
    <path d="M143 158 V482 M163 158 V482 M183 158 V482 M457 158 V482 M437 158 V482 M417 158 V482 M138 163 H462 M138 183 H462 M138 457 H462 M138 437 H462"/>
  </g>
  <!-- Pi + odbiornik (ukryte pod panelem) -->
  <rect x="116" y="264" width="170" height="112" fill="none" stroke="#b03030" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="254" y="300" width="24" height="12" fill="#b03030" opacity="0.8"/>
  <!-- cyfry na marginesie (przód i prawo) -->
  <g font-family="Consolas, monospace" font-weight="bold" fill="#1d8fe0">
    <text x="300" y="452" font-size="30" text-anchor="middle">K 12</text>
    <text x="430" y="330" font-size="30" text-anchor="middle">7</text>
  </g>
  <!-- wkładka gniazda (biała rama 104,6 + uszy) -->
  <g fill="#f4f4f1" stroke="#9a9a94" stroke-width="1">
    <path fill-rule="evenodd" d="M195.5 215.5 H404.5 V404.5 H195.5 Z M203.4 223.4 V396.6 H396.6 V223.4 Z"/>
    <rect x="170" y="128" width="28" height="88"/>
    <rect x="402" y="128" width="28" height="88"/>
    <rect x="270" y="396" width="60" height="9" fill="#dfe3e6" stroke="none"/>
  </g>
  <!-- magnesy i kołki w uszach -->
  <g fill="#777"><circle cx="184" cy="148" r="5"/><circle cx="416" cy="148" r="5"/><circle cx="184" cy="133" r="3"/><circle cx="416" cy="133" r="3"/></g>
  <!-- płytka 96x96 biała -->
  <rect x="204" y="224" width="192" height="192" rx="2" fill="#fbfbf8" stroke="#8c8c86" stroke-width="1"/>
  <!-- znaczniki, wycięcie, dołki kodu, numer -->
  <g fill="#cfcfc8" stroke="#8c8c86" stroke-width="0.6">
    <circle cx="216" cy="404" r="5"/><circle cx="216" cy="236" r="5"/><circle cx="384" cy="236" r="5"/>
    <rect x="386" y="406" width="10" height="10" fill="#dfe3e6"/>
  </g>
  <g fill="#b9b9b2"><circle cx="226" cy="410" r="2"/><circle cx="226" cy="404" r="2"/><circle cx="226" cy="398" r="2"/></g>
  <text x="379" y="403" font-size="9" font-weight="bold" fill="#777" text-anchor="middle">4</text>
  <!-- gniazda: zielone = kuweta bieżąca -->
  <g stroke="#9c9c95" stroke-width="0.8">
    <!-- R1 -->
    <circle cx="240" cy="400" r="10" fill="#e4e4de"/><circle cx="266" cy="400" r="10" fill="url(#glow)"/><circle cx="292" cy="400" r="10" fill="#e4e4de"/><circle cx="318" cy="400" r="10" fill="url(#glow)"/>
    <circle cx="341.5" cy="400" r="7.5" fill="#e4e4de"/><circle cx="362.5" cy="400" r="7.5" fill="#e4e4de"/>
    <!-- R2 -->
    <circle cx="225" cy="371.5" r="12.5" fill="url(#glow)"/><circle cx="256" cy="371.5" r="12.5" fill="#e4e4de"/><circle cx="287" cy="371.5" r="12.5" fill="url(#glow)"/><circle cx="318" cy="371.5" r="12.5" fill="#e4e4de"/><circle cx="349" cy="371.5" r="12.5" fill="url(#glow)"/>
    <circle cx="377.5" cy="371.5" r="10" fill="#e4e4de"/>
    <!-- R3 -->
    <rect x="210" y="327" width="100" height="26" rx="13" fill="url(#glow)"/>
    <circle cx="328.5" cy="340" r="12.5" fill="#e4e4de"/><circle cx="357" cy="340" r="10" fill="#e4e4de"/><circle cx="380.5" cy="340" r="7.5" fill="url(#glow)"/>
    <!-- R4 -->
    <circle cx="219.5" cy="308" r="7.5" fill="#e4e4de"/><circle cx="243" cy="308" r="10" fill="#e4e4de"/><circle cx="271.5" cy="308" r="12.5" fill="#e4e4de"/>
    <rect x="290" y="295" width="100" height="26" rx="13" fill="#e4e4de"/>
    <!-- R5 -->
    <circle cx="222" cy="279" r="10" fill="#e4e4de"/><circle cx="248" cy="279" r="10" fill="#e4e4de"/><circle cx="274" cy="279" r="10" fill="#e4e4de"/><circle cx="300" cy="279" r="10" fill="#e4e4de"/><circle cx="326" cy="279" r="10" fill="#e4e4de"/><circle cx="352" cy="279" r="10" fill="#e4e4de"/><circle cx="378" cy="279" r="10" fill="#e4e4de"/>
    <!-- R6 -->
    <circle cx="247.5" cy="255.5" r="7.5" fill="#e4e4de"/><circle cx="268.5" cy="255.5" r="7.5" fill="#e4e4de"/><circle cx="289.5" cy="255.5" r="7.5" fill="#e4e4de"/><circle cx="310.5" cy="255.5" r="7.5" fill="#e4e4de"/><circle cx="331.5" cy="255.5" r="7.5" fill="#e4e4de"/><circle cx="352.5" cy="255.5" r="7.5" fill="#e4e4de"/>
  </g>
  <!-- opisy widoku z góry -->
  <g fill="#222">
    <text x="100" y="112">Blat 200 × 200 (PA12 grafit)</text>
    <text x="300" y="540" text-anchor="middle" font-style="italic">PRZÓD (użytkownik)</text>
    <text x="508" y="170">okno 162 + dyfuzor</text>
    <text x="508" y="190">(margines 32 mm = cyfry)</text>
    <text x="508" y="225">wkładka gniazda 104,6</text>
    <text x="508" y="240">+ 2 uszy z tyłu (kołek + magnes)</text>
    <text x="508" y="270">płytka poranna 96 × 96 nr 4</text>
    <text x="508" y="285">31 gniazd + 2 rynienki</text>
    <text x="508" y="320" fill="#1e8f2a">zielone = prace kuwety 12</text>
    <text x="508" y="350" fill="#1d8fe0">K 12 / 7 = kuweta i liczba prac</text>
    <text x="508" y="385" fill="#b03030">Pi 4 + Bonnet pod panelem</text>
    <text x="508" y="400" fill="#b03030">■ odbiornik USB klawiatury</text>
    <text x="508" y="415" fill="#b03030">(w środku, sygnał przez plastik)</text>
    <text x="300" y="412" font-size="7" text-anchor="middle" fill="#888">wycięcie palcowe</text>
  </g>
  <path d="M500 383 L290 360" stroke="#b03030" stroke-width="1" fill="none" stroke-dasharray="3 3"/>

  <!-- ===== PODSTAWKA Z KLAWIATURĄ (luzem na stole) ===== -->
  <rect x="640" y="200" width="272" height="242" rx="6" fill="#3a3d42" stroke="#1d1f22" stroke-width="2"/>
  <rect x="646" y="206" width="260" height="180" rx="3" fill="#2a2c30" stroke="#111" stroke-width="1"/>
  <!-- klawiatura numeryczna 130x90 -->
  <rect x="648" y="208" width="256" height="176" rx="4" fill="#d8dadd" stroke="#8d9096"/>
  <g fill="#f5f6f7" stroke="#9a9ea5" stroke-width="1" font-size="11" text-anchor="middle">
    <!-- rząd 1 -->
    <rect x="658" y="216" width="52" height="28" rx="3"/><text x="684" y="235" fill="#333">Num</text>
    <rect x="718" y="216" width="52" height="28" rx="3"/><text x="744" y="235" fill="#333">/</text>
    <rect x="778" y="216" width="52" height="28" rx="3"/><text x="804" y="235" fill="#c0392b">*</text>
    <rect x="838" y="216" width="52" height="28" rx="3"/><text x="864" y="235" fill="#333">⌫</text>
    <!-- rząd 2 -->
    <rect x="658" y="250" width="52" height="28" rx="3"/><text x="684" y="269" fill="#333">7</text>
    <rect x="718" y="250" width="52" height="28" rx="3"/><text x="744" y="269" fill="#333">8</text>
    <rect x="778" y="250" width="52" height="28" rx="3"/><text x="804" y="269" fill="#333">9</text>
    <rect x="838" y="250" width="52" height="62" rx="3"/><text x="864" y="286" fill="#333">+</text>
    <!-- rząd 3 -->
    <rect x="658" y="284" width="52" height="28" rx="3"/><text x="684" y="303" fill="#333">4</text>
    <rect x="718" y="284" width="52" height="28" rx="3"/><text x="744" y="303" fill="#333">5</text>
    <rect x="778" y="284" width="52" height="28" rx="3"/><text x="804" y="303" fill="#333">6</text>
    <!-- rząd 4 -->
    <rect x="658" y="318" width="52" height="28" rx="3"/><text x="684" y="337" fill="#333">1</text>
    <rect x="718" y="318" width="52" height="28" rx="3"/><text x="744" y="337" fill="#333">2</text>
    <rect x="778" y="318" width="52" height="28" rx="3"/><text x="804" y="337" fill="#333">3</text>
    <rect x="838" y="318" width="52" height="62" rx="3" fill="#dfe8d3"/><text x="864" y="354" fill="#2b6b2b">Enter</text>
    <!-- rząd 5 -->
    <rect x="658" y="352" width="112" height="28" rx="3"/><text x="714" y="371" fill="#333">0</text>
    <rect x="778" y="352" width="52" height="28" rx="3"/><text x="804" y="371" fill="#333">.</text>
  </g>
  <!-- wycięcie na palec w tylnej krawędzi -->
  <rect x="746" y="196" width="60" height="10" fill="url(#wood)"/>
  <!-- nalepka legendy 60x20 na pasie przednim -->
  <rect x="660" y="397" width="124" height="44" rx="2" fill="#fff" stroke="#999"/>
  <g font-size="7.5" fill="#222">
    <text x="666" y="407">Enter = następna kuweta</text>
    <text x="666" y="417">cyfry = numer kuwety</text>
    <text x="666" y="427">Backspace = cofnij</text>
    <text x="666" y="437">* = zamknij piec</text>
  </g>
  <text x="850" y="424" font-size="9" fill="#ddd" text-anchor="middle" font-weight="bold">RAMKA PORANNA</text>
  <g fill="#222">
    <text x="640" y="192">Podstawka klawiatury 136 × 121 (PA12 grafit), luzem na stole</text>
    <text x="640" y="462">Klawiatura numeryczna bezprzewodowa 2,4 GHz (kupowana)</text>
    <text x="640" y="478">łączy się z odbiornikiem USB w ramce; brak kabla między nimi</text>
  </g>
  <path d="M615 330 Q600 300 585 330 Q570 360 555 330" stroke="#b03030" stroke-width="1.2" fill="none"/>
  <text x="585" y="310" font-size="10" fill="#b03030" text-anchor="middle">2,4 GHz</text>

  <!-- ===== WIDOK Z PRZODU ===== -->
  <text x="100" y="588" fill="#222">Widok z przodu (ramka poranna): 200 × 58,6 mm</text>
  <rect x="100" y="603" width="400" height="117" rx="6" fill="#3a3d42" stroke="#1d1f22" stroke-width="2"/>
  <!-- blat 4 mm -->
  <rect x="100" y="603" width="400" height="8" rx="3" fill="#45484e" stroke="#1d1f22" stroke-width="1"/>
  <!-- wkładka + płytka wystające nad blat -->
  <rect x="195.5" y="591" width="209" height="12" fill="#f4f4f1" stroke="#9a9a94"/>
  <rect x="204" y="582" width="192" height="14" fill="#fbfbf8" stroke="#8c8c86"/>
  <!-- napis relief -->
  <text x="300" y="634" font-size="16" font-weight="bold" fill="#5a5e66" text-anchor="middle" letter-spacing="2">RAMKA PORANNA</text>
  <!-- zaślepka otworu przycisku ø30, oś x=+30, Z=22 -->
  <circle cx="360" cy="676" r="34" fill="#2f3237" stroke="#1d1f22"/>
  <circle cx="360" cy="676" r="30" fill="#3a3d42" stroke="#26282b"/>
  <text x="360" y="722" font-size="9" fill="#ddd" text-anchor="middle">zaślepka (przycisk tylko w wieczornej)</text>
  <!-- miejsce głowicy gestu (tylko wieczorna) -->
  <rect x="126" y="628" width="68" height="32" fill="none" stroke="#999" stroke-dasharray="4 3"/>
  <text x="160" y="672" font-size="9" fill="#555" text-anchor="middle">głowica gestu</text>
  <text x="160" y="682" font-size="9" fill="#555" text-anchor="middle">(tylko wieczorna)</text>
  <!-- stopki 4 mm -->
  <rect x="120" y="720" width="20" height="8" fill="#222"/><rect x="460" y="720" width="20" height="8" fill="#222"/>
  <text x="300" y="748" fill="#222" text-anchor="middle">Płytka 96 × 96 leży we wkładce na blacie; brak widocznych śrub, brak klawiatury w obudowie.</text>
</svg>
